name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web and Capacitor
        run: |
          npm install || true
          # Пробуем собрать проект, но если команды нет — идем дальше
          npm run build --if-present || true
          
          # Устанавливаем Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android || true
          
          # Если папки android еще нет, создаем её принудительно
          if [ ! -d "android" ]; then
            npx cap init Solla com.solla.app --web-dir . --yes
            npx cap add android
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solla-apk
          path: android/app/build/outputs/apk/debug/*.apk
